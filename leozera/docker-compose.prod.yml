services:
  postgres:
    ports: !override []

  backend:
    ports: !override []
    volumes: !override []
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ENVIRONMENT: production

  frontend:
    build:
      target: production
    volumes: !override []
    command: ["npm", "run", "start", "--", "--hostname", "0.0.0.0", "--port", "3000"]
    environment:
      API_URL: http://backend:8000
